name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blinkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/blinkit_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Create database tables
        run: psql "$TEST_DB_URL" -f server/db/schema.sql

      - name: Create test env file
        working-directory: server
        run: |
          echo "DATABASE_URL_POOLED=$TEST_DB_URL" >> .env.test
          echo "RESERVATION_TTL_MINUTES=10" >> .env.test

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Build Docker image
        run: docker build -t blinkit-inventory-api .